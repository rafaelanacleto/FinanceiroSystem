services:
  postgres:
    image: postgres:16-alpine
    container_name: financeiro-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Rafael.2026!"
      POSTGRES_DB: financeiro
    ports:
      - "5432:5432"
    networks:
      - financeiro-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: financeiro-auth
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: dev-file
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    ports:
      - "0.0.0.0:8080:8080"
    networks:
      - financeiro-net
    volumes:
      - keycloak_data:/opt/keycloak/data

  redis:
    image: redis:alpine
    container_name: financeiro-cache
    ports:
      - "6379:6379"
    networks:
      - financeiro-net

